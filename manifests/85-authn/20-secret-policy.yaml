apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bedrock-authn-secrets
  labels:
    bedrock.cloudyfolks.io/component: authn
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [secrets]
  matchConditions:
    - name: authn-identity
      expression: "request.userInfo.username == 'system:serviceaccount:bedrock-system:bedrock-authn'"
  validations:
    - expression: >-
        (request.operation != 'CREATE' && request.operation != 'UPDATE') ||
        (object.metadata.namespace == 'bedrock-system' && has(object.metadata.labels) &&
         'bedrock.cloudyfolks.io/authn' in object.metadata.labels &&
         object.metadata.labels['bedrock.cloudyfolks.io/authn'] == 'true')
      message: "bedrock-authn may only write Secrets labeled bedrock.cloudyfolks.io/authn=true in bedrock-system"
      reason: Forbidden
    - expression: >-
        (request.operation != 'UPDATE' && request.operation != 'DELETE') ||
        (oldObject.metadata.namespace == 'bedrock-system' && has(oldObject.metadata.labels) &&
         'bedrock.cloudyfolks.io/authn' in oldObject.metadata.labels &&
         oldObject.metadata.labels['bedrock.cloudyfolks.io/authn'] == 'true')
      message: "bedrock-authn may not update or delete a Secret outside its own label"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bedrock-authn-secrets
  labels:
    bedrock.cloudyfolks.io/component: authn
spec:
  policyName: bedrock-authn-secrets
  validationActions: [Deny]
