apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bedrock-objectstorage-account
  labels:
    bedrock.cloudyfolks.io/kind: ValidatingAdmissionPolicy
    bedrock.cloudyfolks.io/name: bedrock-objectstorage-account
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [namespaces]
  matchConditions:
    - name: bedrock-identity
      expression: "request.userInfo.username.startsWith('bedrock:')"
    - name: account-name-involved
      expression: "object.metadata.?annotations['bedrock.cloudyfolks.io/object-storage-account'].hasValue() || (request.operation == 'UPDATE' && oldObject.metadata.?annotations['bedrock.cloudyfolks.io/object-storage-account'].hasValue())"
  variables:
    - name: accountNew
      expression: "object.metadata.?annotations['bedrock.cloudyfolks.io/object-storage-account'].orValue('')"
    - name: accountOld
      expression: "request.operation == 'CREATE' ? '' : oldObject.metadata.?annotations['bedrock.cloudyfolks.io/object-storage-account'].orValue('')"
  validations:
    - expression: >-
        variables.accountNew == variables.accountOld ||
        (variables.accountOld == '' && 'bedrock:bedrock-admins' in request.userInfo.groups)
      message: "only an administrator may set the object storage account name, and it cannot change afterwards"
      reason: Forbidden
    - expression: "variables.accountNew == '' || variables.accountNew.matches('^[A-Za-z0-9._-]{1,200}$')"
      message: "the object storage account name may hold letters, digits, dot, underscore and dash"
      reason: Invalid
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bedrock-objectstorage-account
  labels:
    bedrock.cloudyfolks.io/kind: ValidatingAdmissionPolicyBinding
    bedrock.cloudyfolks.io/name: bedrock-objectstorage-account
spec:
  policyName: bedrock-objectstorage-account
  validationActions: [Deny]
