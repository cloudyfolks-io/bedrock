      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bedrock-tenant-deployments
  labels:
    bedrock.cloudyfolks.io/kind: ValidatingAdmissionPolicyBinding
