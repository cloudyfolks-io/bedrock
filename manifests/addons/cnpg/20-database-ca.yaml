apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: bedrock-database-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bedrock-database-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: bedrock-database-ca
  secretName: bedrock-database-ca
  duration: 87600h
  renewBefore: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: bedrock-database-selfsigned
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: bedrock-database-ca
spec:
  ca:
    secretName: bedrock-database-ca
