k0sVersion: v1.36.3+k0s.0
supportedOS:
  - ubuntu-24.04
  - ubuntu-22.04
  - debian-13
  - debian-12
  - fedora-43
  - fedora-42
  - rhel-10
  - rhel-9
  - centos-stream-10
  - centos-stream-9
  - sles-16
  - sles-15
upgradeFrom: []
components:
  - name: crds
    order: 0
    dirs: [manifests/00-crds]
  - name: kube-vip
    order: 10
    dirs: [manifests/10-kube-vip]
  - name: fabric
    order: 20
    chart: charts/fabric
    version: 1.2.1
    namespace: kube-system
    values: release/values/fabric.yaml
    crdsToGroup: crds
  - name: multus
    order: 25
    version: v4.3.1
    dirs: [manifests/25-multus]
    crdsToGroup: crds
  - name: nmstate
    order: 30
    version: v0.87.0
    dirs: [manifests/30-nmstate]
    crdsToGroup: crds
    extraImages: [quay.io/nmstate/kubernetes-nmstate-handler:v0.87.0]
  - name: rook
    order: 40
    chart: charts/rook-ceph
    version: v1.20.7
    namespace: rook-ceph
    values: release/values/rook.yaml
    dirs: [manifests/40-rook]
    crdsToGroup: crds
    image: quay.io/ceph/ceph:v20.2.4
    extraImages:
      - quay.io/cephcsi/cephcsi:v3.17.1
      - registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.17.0
      - registry.k8s.io/sig-storage/csi-provisioner:v6.2.0
      - registry.k8s.io/sig-storage/csi-snapshotter:v8.5.0
      - registry.k8s.io/sig-storage/csi-attacher:v4.12.0
      - registry.k8s.io/sig-storage/csi-resizer:v2.1.0
  - name: rook-csi
    order: 41
    chart: charts/ceph-csi-drivers
    version: 1.0.4
    namespace: rook-ceph
    values: release/values/rook-csi.yaml
  - name: kubevirt
    order: 50
    version: v1.9.0
    dirs: [manifests/50-kubevirt]
    crdsToGroup: crds
    keepTags: true
    extraImages:
      - quay.io/kubevirt/virt-api:v1.9.0
      - quay.io/kubevirt/virt-controller:v1.9.0
      - quay.io/kubevirt/virt-handler:v1.9.0
      - quay.io/kubevirt/virt-launcher:v1.9.0
      - quay.io/kubevirt/virt-exportproxy:v1.9.0
      - quay.io/kubevirt/virt-exportserver:v1.9.0
      - quay.io/kubevirt/sidecar-shim:v1.9.0
      - quay.io/kubevirt/pr-helper:v1.9.0
      - quay.io/kubevirt/virt-template-apiserver:v0.2.2
      - quay.io/kubevirt/virt-template-controller:v0.2.2
      - quay.io/kubevirt/cdi-controller:v1.66.1
      - quay.io/kubevirt/cdi-importer:v1.66.1
      - quay.io/kubevirt/cdi-cloner:v1.66.1
      - quay.io/kubevirt/cdi-apiserver:v1.66.1
      - quay.io/kubevirt/cdi-uploadserver:v1.66.1
      - quay.io/kubevirt/cdi-uploadproxy:v1.66.1
      - quay.io/kubevirt/cirros-container-disk-demo:v1.9.0
  - name: cert-manager
    order: 60
    chart: charts/cert-manager
    version: v1.20.2
    namespace: cert-manager
    values: release/values/cert-manager.yaml
    crdsToGroup: crds
    extraImages: [quay.io/jetstack/cert-manager-acmesolver:v1.20.2]
  - name: traefik
    order: 65
    chart: charts/traefik
    version: 41.6.0
    namespace: traefik
    values: release/values/traefik.yaml
    crdsToGroup: crds
  - name: authn
    order: 85
    dirs: [manifests/85-authn]
  - name: monitoring
    order: 70
    chart: charts/metrics-server
    version: 3.13.1
    namespace: kube-system
    values: release/values/metrics-server.yaml
  - name: kured
    order: 80
    chart: charts/kured
    version: 6.1.0
    namespace: kube-system
    values: release/values/kured.yaml
  - name: bedrock
    order: 90
    dirs: [manifests/90-bedrock]
