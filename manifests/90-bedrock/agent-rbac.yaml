apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bedrock-agent
  labels:
    bedrock.cloudyfolks.io/component: bedrock
rules:
  - apiGroups: [bedrock.cloudyfolks.io]
    resources: [hosts, hostconfigs]
    verbs: [get, list, watch]
  - apiGroups: [bedrock.cloudyfolks.io]
    resources: [hosts/status]
    verbs: [get, update, patch]
  - apiGroups: [bedrock.cloudyfolks.io]
    resources: [nodeupgrades, releases]
    verbs: [get, list, watch]
  - apiGroups: [bedrock.cloudyfolks.io]
    resources: [nodeupgrades/status]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bedrock-agent
  labels:
    bedrock.cloudyfolks.io/component: bedrock
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bedrock-agent
subjects:
  - kind: Group
    name: system:nodes
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bedrock-agent-own-host
  labels:
    bedrock.cloudyfolks.io/component: bedrock
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [bedrock.cloudyfolks.io]
        apiVersions: [v1alpha1]
        operations: [UPDATE]
        resources: [hosts/status]
  matchConditions:
    - name: node-identity
      expression: "request.userInfo.username.startsWith('system:node:')"
  validations:
    - expression: "request.userInfo.username == 'system:node:' + object.metadata.name"
      message: "a node may only update the status of its own Host"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bedrock-agent-own-host
  labels:
    bedrock.cloudyfolks.io/component: bedrock
spec:
  policyName: bedrock-agent-own-host
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bedrock-agent-own-nodeupgrade
  labels:
    bedrock.cloudyfolks.io/component: bedrock
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [bedrock.cloudyfolks.io]
        apiVersions: [v1alpha1]
        operations: [UPDATE]
        resources: [nodeupgrades/status]
  matchConditions:
    - name: node-identity
      expression: "request.userInfo.username.startsWith('system:node:')"
  validations:
    - expression: "request.userInfo.username == 'system:node:' + object.spec.node"
      message: "a node may only update the status of its own NodeUpgrade"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bedrock-agent-own-nodeupgrade
  labels:
    bedrock.cloudyfolks.io/component: bedrock
spec:
  policyName: bedrock-agent-own-nodeupgrade
  validationActions: [Deny]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bedrock-agent-authn
  namespace: bedrock-system
  labels:
    bedrock.cloudyfolks.io/component: bedrock
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [bedrock-authn-apiserver]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [bedrock-authn-webhook]
    verbs: [get, list, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [bedrock-authn-apiserver-restart]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bedrock-agent-authn
  namespace: bedrock-system
  labels:
    bedrock.cloudyfolks.io/component: bedrock
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bedrock-agent-authn
subjects:
  - kind: Group
    name: system:nodes
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: bedrock-authn-apiserver-restart
  namespace: bedrock-system
  labels:
    bedrock.cloudyfolks.io/component: bedrock
