apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bedrock-fabric-pinger
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      app.kubernetes.io/name: fabric-pinger
  endpoints:
    - port: metrics
      honorLabels: true
