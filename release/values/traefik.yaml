deployment:
  kind: DaemonSet
nodeSelector:
  bedrock.cloudyfolks.io/role-control-plane: "true"
tolerations:
  - operator: Exists
service:
  spec:
    externalTrafficPolicy: Local
  annotations:
    kube-vip.io/loadbalancerIPs: "${BEDROCK_VIP}"
ports:
  websecure:
    transport:
      respondingTimeouts:
        readTimeout: 2h
  web:
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
providers:
  kubernetesCRD:
    namespaces:
      - traefik
      - bedrock-system
      - bedrock-registry
      - cdi
      - rook-ceph
  kubernetesIngress:
    namespaces:
      - traefik
      - bedrock-system
      - bedrock-registry
      - cdi
      - rook-ceph
    publishedService:
      enabled: true
tlsStore:
  default:
    defaultCertificate:
      secretName: platform-tls
