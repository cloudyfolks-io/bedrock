apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bedrock-agent-etcd-ship
  labels:
    bedrock.cloudyfolks.io/component: bedrock
rules:
  - apiGroups: [bedrock.cloudyfolks.io]
    resources: [settings]
    resourceNames: [backup.target]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bedrock-agent-etcd-ship
  labels:
    bedrock.cloudyfolks.io/component: bedrock
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bedrock-agent-etcd-ship
subjects:
  - kind: Group
    name: system:nodes
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bedrock-agent-etcd-ship
  namespace: bedrock-system
  labels:
    bedrock.cloudyfolks.io/component: bedrock
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [bedrock-agent-backup-s3]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bedrock-agent-etcd-ship
  namespace: bedrock-system
  labels:
    bedrock.cloudyfolks.io/component: bedrock
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bedrock-agent-etcd-ship
subjects:
  - kind: Group
    name: system:nodes
    apiGroup: rbac.authorization.k8s.io
