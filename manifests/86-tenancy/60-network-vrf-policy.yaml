apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bedrock-network-vrf
  labels:
    bedrock.cloudyfolks.io/kind: ValidatingAdmissionPolicy
    bedrock.cloudyfolks.io/name: bedrock-network-vrf
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [bedrock.cloudyfolks.io]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE]
        resources: [networks]
  matchConditions:
    - name: bedrock-identity
      expression: "request.userInfo.username.startsWith('bedrock:')"
    - name: vrf-involved
      expression: "has(object.spec.vrfId) || (request.operation == 'UPDATE' && has(oldObject.spec.vrfId))"
  variables:
    - name: newVrf
      expression: "has(object.spec.vrfId) ? object.spec.vrfId : 0"
    - name: oldVrf
      expression: "request.operation == 'UPDATE' && has(oldObject.spec.vrfId) ? oldObject.spec.vrfId : 0"
  validations:
    - expression: "variables.newVrf == variables.oldVrf || 'bedrock:bedrock-admins' in request.userInfo.groups"
      message: "only an administrator may set or change vrfId"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bedrock-network-vrf
  labels:
    bedrock.cloudyfolks.io/kind: ValidatingAdmissionPolicyBinding
    bedrock.cloudyfolks.io/name: bedrock-network-vrf
spec:
  policyName: bedrock-network-vrf
  validationActions: [Deny]
