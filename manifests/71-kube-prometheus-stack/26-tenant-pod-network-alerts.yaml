apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: bedrock-tenant-pod-network
  namespace: monitoring
spec:
  groups:
    - name: bedrock.tenant-pod-network
      rules:
        - alert: TenantPodNetworkAudit
          expr: >-
            sum by (policy, policy_binding) (increase(apiserver_validating_admission_policy_check_total{policy=~"bedrock-tenant-pod-network.*",
            enforcement_action=~"audit|warn"}[15m])) > 0
          labels:
            severity: warning
          annotations:
            summary: Tenant pods break the pod network policy in audit mode.
            description: The policy {{ $labels.policy }} found {{ $value }} pod requests that break it in the last 15 minutes. The binding only audits, so the pods were admitted. Find them in the audit log of the API server, in the annotation validation.policy.admission.k8s.io/validation_failure, or fix the pod builder. Then set tenancy.pod-network-admission to deny.
            runbook_url: https://github.com/cloudyfolks-io/bedrock/blob/main/docs/alerts.md#tenantpodnetworkaudit
        - alert: TenantPodNetworkDenied
          expr: >-
            sum by (policy, policy_binding) (increase(apiserver_validating_admission_policy_check_total{policy=~"bedrock-tenant-pod-network.*",
            enforcement_action="deny"}[15m])) > 0
          labels:
            severity: critical
          annotations:
            summary: The pod network policy rejects tenant pods.
            description: The policy {{ $labels.policy }} rejected {{ $value }} pod requests in the last 15 minutes. Customer workloads may not start. Find the service that builds the pod without the network annotations.
            runbook_url: https://github.com/cloudyfolks-io/bedrock/blob/main/docs/alerts.md#tenantpodnetworkdenied
        - alert: TenantPodNetworkError
          expr: >-
            sum by (policy, policy_binding, error_type) (increase(apiserver_validating_admission_policy_check_total{policy=~"bedrock-tenant-pod-network.*",
            error_type!~"no_error|"}[15m])) > 0
          labels:
            severity: warning
          annotations:
            summary: The pod network policy fails to evaluate.
            description: The policy {{ $labels.policy }} returned {{ $labels.error_type }} errors. A CEL expression does not compile or breaks on some pods. The policy fails closed, so with a deny binding this blocks pods.

            runbook_url: https://github.com/cloudyfolks-io/bedrock/blob/main/docs/alerts.md#tenantpodnetworkerror