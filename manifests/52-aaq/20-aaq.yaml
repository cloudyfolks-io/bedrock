apiVersion: aaq.kubevirt.io/v1alpha1
kind: AAQ
metadata:
  name: aaq
spec:
  imagePullPolicy: IfNotPresent
  configuration:
    vmiCalculatorConfiguration:
      configName: VirtualResources
  infra:
    nodeSelector:
      kubernetes.io/os: linux
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
  workload:
    nodeSelector:
      kubernetes.io/os: linux
