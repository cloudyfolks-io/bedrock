apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bedrock-metrics-readers
  namespace: monitoring
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [prometheus, loki]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [monitoring, bedrock-system]
        - ipBlock:
            cidr: 100.64.0.0/16
