apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bedrock-agent-audit
  namespace: bedrock-system
  labels:
    bedrock.cloudyfolks.io/component: bedrock
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [bedrock-audit-policy]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bedrock-agent-audit
  namespace: bedrock-system
  labels:
    bedrock.cloudyfolks.io/component: bedrock
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bedrock-agent-audit
subjects:
  - kind: Group
    name: system:nodes
    apiGroup: rbac.authorization.k8s.io
