---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: networks.bedrock.cloudyfolks.io
spec:
  group: bedrock.cloudyfolks.io
  names:
    kind: Network
    listKind: NetworkList
    plural: networks
    singular: network
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.tenantRef
      name: Tenant
      type: string
    - jsonPath: .spec.cidr
      name: CIDR
      type: string
    - jsonPath: .spec.cidrs
      name: CIDRs
      type: string
    - jsonPath: .status.vpc
      name: VPC
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              cidr:
                maxLength: 43
                type: string
                x-kubernetes-validations:
                - message: cidr must be a CIDR
                  rule: isCIDR(self)
                - message: cidr is immutable
                  rule: self == oldSelf
              cidrs:
                items:
                  maxLength: 43
                  type: string
                  x-kubernetes-validations:
                  - message: every cidrs entry must be a canonical IPv4 network
                    rule: isCIDR(self) && cidr(self).ip().family() == 4 && string(cidr(self).masked())
                      == self
                maxItems: 8
                minItems: 1
                type: array
                x-kubernetes-list-type: set
                x-kubernetes-validations:
                - message: the cidrs must not overlap each other
                  rule: self.all(a, self.all(b, a == b || !isCIDR(a) || !isCIDR(b)
                    || !(cidr(a).containsCIDR(b) || cidr(b).containsCIDR(a))))
              enableExternal:
                type: boolean
              tenantRef:
                maxLength: 30
                minLength: 1
                pattern: ^[a-z0-9]+$
                type: string
                x-kubernetes-validations:
                - message: tenantRef is immutable
                  rule: self == oldSelf
            required:
            - tenantRef
            type: object
            x-kubernetes-validations:
            - message: set exactly one of cidr and cidrs; cidrs replaces cidr
              rule: has(self.cidr) != has(self.cidrs)
            - message: cidr can only be replaced by a cidrs list that holds it
              rule: '!has(oldSelf.cidr) || (has(self.cidr) && self.cidr == oldSelf.cidr)
                || (has(self.cidrs) && oldSelf.cidr in self.cidrs)'
            - message: cidrs can only be added to
              rule: '!has(oldSelf.cidrs) || (has(self.cidrs) && oldSelf.cidrs.all(c,
                c in self.cidrs))'
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              subnets:
                items:
                  properties:
                    cidr:
                      maxLength: 43
                      type: string
                    name:
                      maxLength: 63
                      type: string
                    namespace:
                      maxLength: 63
                      type: string
                  required:
                  - cidr
                  - name
                  - namespace
                  type: object
                maxItems: 512
                type: array
                x-kubernetes-list-map-keys:
                - namespace
                - name
                x-kubernetes-list-type: map
              vpc:
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: the name must be a DNS label of at most 30 characters
          rule: self.metadata.name.size() <= 30 && self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
        - message: the name is reserved for the Fabric underlay
          rule: '!self.metadata.name.startsWith(''provider-'') && self.metadata.name
            != ''ovn-cluster'''
    served: true
    storage: true
    subresources:
      status: {}
