apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
    helm.sh/resource-policy: keep
  name: dns-zones.fabric.cloudyfolks.io
spec:
  group: fabric.cloudyfolks.io
  names:
    kind: DNSZone
    listKind: DNSZoneList
    plural: dns-zones
    singular: dns-zone
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.vpc
      name: Vpc
      type: string
    - jsonPath: .status.activeRecords
      name: Records
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              records:
                items:
                  properties:
                    ips:
                      items:
                        type: string
                      minItems: 1
                      type: array
                    name:
                      minLength: 1
                      type: string
                  required:
                  - ips
                  - name
                  type: object
                type: array
              vpc:
                minLength: 1
                type: string
            required:
            - vpc
            type: object
          status:
            properties:
              activeRecords:
                format: int64
                type: integer
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    lastUpdateTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      type: integer
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
