name: release
on:
  push:
    tags: ["v*"]
jobs:
  qualification:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  release:
    needs: qualification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /opt/hostedtoolcache/CodeQL && docker image prune -af && df -h /
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - uses: sigstore/cosign-installer@v4.1.2
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: make release VERSION="$GITHUB_REF_NAME" PIN_DIGESTS=1
      - name: Verify Fabric in the rendered release
        run: bin/bedrock release verify-fabric --release dist/release --values release/values/fabric.yaml
      - id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/cloudyfolks-io/bedrock:${{ github.ref_name }}
          build-args: VERSION=${{ github.ref_name }}
      - name: Verify Fabric in the pushed Bedrock images
        env:
          BEDROCK_RELEASE_IMAGE: ghcr.io/cloudyfolks-io/bedrock@${{ steps.image.outputs.digest }}
        run: |
          release_dir=$(mktemp -d "$RUNNER_TEMP/bedrock-image-release.XXXXXX")
          container=
          trap 'if [ -n "$container" ]; then docker rm "$container" >/dev/null; fi; rm -rf "$release_dir"' EXIT
          for arch in amd64 arm64; do
            docker pull --platform "linux/$arch" "$BEDROCK_RELEASE_IMAGE"
            container=$(docker create --pull=never --platform "linux/$arch" "$BEDROCK_RELEASE_IMAGE")
            mkdir "$release_dir/$arch"
            docker cp "$container:/release/." "$release_dir/$arch"
            bin/bedrock release verify-fabric --release "$release_dir/$arch" --values release/values/fabric.yaml
            docker rm "$container" >/dev/null
            container=
          done
      - run: bin/bedrock release pin-image --release dist/release --digest ${{ steps.image.outputs.digest }}
      - run: REQUIRE_PINNED_IMAGE=1 hack/check-release.sh dist/release
      - name: Build the offline bundle and verify its Fabric pin
        run: |
          bundle="dist/bedrock-$GITHUB_REF_NAME-bundle-amd64.tar.zst"
          bundle_dir=$(mktemp -d "$RUNNER_TEMP/bedrock-offline.XXXXXX")
          trap 'rm -rf "$bundle_dir"' EXIT
          bin/bedrock bundle build --release dist/release --arch amd64 --out "$bundle" \
            --bedrock-binary "dist/bedrock-$GITHUB_REF_NAME-linux-amd64"
          tar --zstd -xf "$bundle" -C "$bundle_dir" release
          bin/bedrock release verify-fabric --release "$bundle_dir/release" --values release/values/fabric.yaml
      - run: cosign sign --yes ghcr.io/cloudyfolks-io/bedrock@${{ steps.image.outputs.digest }}
      - run: cd dist && sha256sum bedrock-${{ github.ref_name }}-linux-amd64 bedrock-${{ github.ref_name }}-linux-arm64 bedrock-${{ github.ref_name }}-bundle-amd64.tar.zst > SHA256SUMS
      - run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - run: cd dist && split -b 1900M -d -a 2 bedrock-${{ github.ref_name }}-bundle-amd64.tar.zst bedrock-${{ github.ref_name }}-bundle-amd64.tar.zst.part && rm bedrock-${{ github.ref_name }}-bundle-amd64.tar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: assets
          path: |
            dist/bedrock-*
            dist/SHA256SUMS
            dist/SHA256SUMS.sigstore.json
  publish:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: assets
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/bedrock-${{ github.ref_name }}-linux-amd64
            dist/bedrock-${{ github.ref_name }}-linux-arm64
            dist/bedrock-${{ github.ref_name }}-bundle-amd64.tar.zst.part*
            dist/SHA256SUMS
            dist/SHA256SUMS.sigstore.json
          body: |
            The offline bundle is split in parts below 2 GiB. Join the parts and check the sum before `bedrock init --bundle`:

            ```
            cat bedrock-${{ github.ref_name }}-bundle-amd64.tar.zst.part* > bedrock-${{ github.ref_name }}-bundle-amd64.tar.zst
            sha256sum -c --ignore-missing SHA256SUMS
            ```
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
