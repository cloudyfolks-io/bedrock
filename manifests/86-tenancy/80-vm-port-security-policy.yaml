apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bedrock-vm-port-security
  labels:
    bedrock.cloudyfolks.io/kind: ValidatingAdmissionPolicy
    bedrock.cloudyfolks.io/name: bedrock-vm-port-security
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [bedrock.cloudyfolks.io]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE]
        resources: [virtualmachines]
  matchConditions:
    - name: bedrock-identity
      expression: "request.userInfo.username.startsWith('bedrock:')"
  variables:
    - name: newOff
      expression: "has(object.spec.networks) ? object.spec.networks.filter(n, has(n.portSecurity) && !n.portSecurity).map(n, n.subnetRef) : []"
    - name: oldOff
      expression: "request.operation == 'UPDATE' && has(oldObject.spec.networks) ? oldObject.spec.networks.filter(n, has(n.portSecurity) && !n.portSecurity).map(n, n.subnetRef) : []"
  validations:
    - expression: "(size(variables.newOff) == size(variables.oldOff) && variables.newOff.all(s, s in variables.oldOff)) || 'bedrock:bedrock-admins' in request.userInfo.groups"
      message: "only an administrator may set or change portSecurity"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bedrock-vm-port-security
  labels:
    bedrock.cloudyfolks.io/kind: ValidatingAdmissionPolicyBinding
    bedrock.cloudyfolks.io/name: bedrock-vm-port-security
spec:
  policyName: bedrock-vm-port-security
  validationActions: [Deny]
