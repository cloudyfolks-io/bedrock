apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bedrock-objectstorage-user-adopt
  labels:
    bedrock.cloudyfolks.io/kind: ValidatingAdmissionPolicy
    bedrock.cloudyfolks.io/name: bedrock-objectstorage-user-adopt
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [bedrock.cloudyfolks.io]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE]
        resources: [objectstorageusers]
  matchConditions:
    - name: bedrock-identity
      expression: "request.userInfo.username.startsWith('bedrock:')"
    - name: adopt-involved
      expression: "object.metadata.?annotations['bedrock.cloudyfolks.io/adopt-rgw-user'].hasValue() || (request.operation == 'UPDATE' && oldObject.metadata.?annotations['bedrock.cloudyfolks.io/adopt-rgw-user'].hasValue())"
  variables:
    - name: adoptNew
      expression: "object.metadata.?annotations['bedrock.cloudyfolks.io/adopt-rgw-user'].orValue('')"
    - name: adoptOld
      expression: "request.operation == 'CREATE' ? '' : oldObject.metadata.?annotations['bedrock.cloudyfolks.io/adopt-rgw-user'].orValue('')"
  validations:
    - expression: >-
        variables.adoptNew == variables.adoptOld ||
        (request.operation == 'CREATE' && 'bedrock:bedrock-admins' in request.userInfo.groups)
      message: "only an administrator may set the adopt-rgw-user annotation, when the user is created, and it cannot change afterwards"
      reason: Forbidden
    - expression: "variables.adoptNew == '' || variables.adoptNew.matches('^[a-z0-9]([-a-z0-9.]{0,198}[a-z0-9])?$')"
      message: "the RGW user name must be lowercase letters, digits, dot and dash"
      reason: Invalid
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bedrock-objectstorage-user-adopt
  labels:
    bedrock.cloudyfolks.io/kind: ValidatingAdmissionPolicyBinding
    bedrock.cloudyfolks.io/name: bedrock-objectstorage-user-adopt
spec:
  policyName: bedrock-objectstorage-user-adopt
  validationActions: [Deny]
