deployment:
  replicas: 1
service:
  annotations:
    kube-vip.io/loadbalancerIPs: "${BEDROCK_VIP}"
ports:
  websecure:
    transport:
      respondingTimeouts:
        readTimeout: 2h
  web:
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
providers:
  kubernetesIngress:
    publishedService:
      enabled: true
tlsStore:
  default:
    defaultCertificate:
      secretName: platform-tls
