---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: containers.bedrock.cloudyfolks.io
spec:
  group: bedrock.cloudyfolks.io
  names:
    kind: Container
    listKind: ContainerList
    plural: containers
    singular: container
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.image
      name: Image
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.replicas
      name: Replicas
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              args:
                items:
                  type: string
                maxItems: 256
                type: array
                x-kubernetes-list-type: atomic
              autoscale:
                properties:
                  cpuPercent:
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                  max:
                    format: int32
                    maximum: 20
                    minimum: 1
                    type: integer
                  memoryPercent:
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                  min:
                    format: int32
                    maximum: 20
                    minimum: 1
                    type: integer
                required:
                - max
                - min
                type: object
                x-kubernetes-validations:
                - message: min must not be above max
                  rule: self.min <= self.max
              command:
                items:
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: atomic
              env:
                items:
                  properties:
                    name:
                      maxLength: 253
                      minLength: 1
                      pattern: ^[-._a-zA-Z][-._a-zA-Z0-9]*$
                      type: string
                    value:
                      maxLength: 32768
                      type: string
                    valueFrom:
                      properties:
                        secretKeyRef:
                          properties:
                            key:
                              maxLength: 253
                              minLength: 1
                              pattern: ^[-._a-zA-Z0-9]+$
                              type: string
                            name:
                              maxLength: 253
                              minLength: 1
                              pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                              type: string
                          required:
                          - key
                          - name
                          type: object
                      required:
                      - secretKeyRef
                      type: object
                  required:
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: set exactly one of value and valueFrom
                    rule: has(self.value) != has(self.valueFrom)
                maxItems: 128
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              fsGroup:
                format: int64
                minimum: 0
                type: integer
              image:
                maxLength: 1024
                minLength: 1
                type: string
              imagePullSecrets:
                items:
                  maxLength: 253
                  pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                  type: string
                maxItems: 8
                type: array
                x-kubernetes-list-type: set
              network:
                default: {}
                properties:
                  address:
                    maxLength: 15
                    type: string
                    x-kubernetes-validations:
                    - message: address must be an IPv4 address
                      rule: isIP(self) && ip(self).family() == 4
                  securityGroups:
                    items:
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    maxItems: 8
                    type: array
                    x-kubernetes-list-type: set
                  subnetRef:
                    default: default
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                    x-kubernetes-validations:
                    - message: subnetRef is immutable
                      rule: self == oldSelf
                type: object
                x-kubernetes-validations:
                - message: address is immutable
                  rule: has(self.address) == has(oldSelf.address) && (!has(self.address)
                    || self.address == oldSelf.address)
              ports:
                items:
                  properties:
                    name:
                      maxLength: 15
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    port:
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                    protocol:
                      default: TCP
                      enum:
                      - TCP
                      - UDP
                      - SCTP
                      type: string
                  required:
                  - port
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-type: atomic
                x-kubernetes-validations:
                - message: a port and protocol can be listed once
                  rule: 'self.all(a, self.exists_one(b, b.port == a.port && (has(a.protocol)
