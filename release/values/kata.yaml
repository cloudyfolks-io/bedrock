k8sDistribution: k0s
imagePullPolicy: IfNotPresent
nodeSelector:
  bedrock.cloudyfolks.io/kvm: "true"
snapshotter:
  setup: []
shims:
  disableAll: true
  qemu:
    enabled: true
    runtimeClass:
      overhead:
        memory: 512Mi
        cpu: 250m
    dropIn: |
      [hypervisor.qemu]
      default_memory = 512
      virtio_fs_extra_args = ["-o", "xattr"]
defaultShim:
  amd64: qemu
  arm64: qemu
runtimeClasses:
  createDefault: true
  defaultName: kata
node-feature-discovery:
  enabled: false
