apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
    helm.sh/resource-policy: keep
  name: provider-networks.fabric.cloudyfolks.io
spec:
  group: fabric.cloudyfolks.io
  names:
    kind: ProviderNetwork
    listKind: ProviderNetworkList
    plural: provider-networks
    shortNames:
    - pn
    singular: provider-network
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.defaultInterface
      name: DefaultInterface
      type: string
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    name: v1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              autoCreateVlanSubinterfaces:
                type: boolean
              customInterfaces:
                items:
                  properties:
                    interface:
                      maxLength: 15
                      pattern: ^[^/\s]+$
                      type: string
                    nodes:
                      items:
                        type: string
                      type: array
                  type: object
                type: array
              defaultInterface:
                maxLength: 15
                pattern: ^[^/\s]+$
                type: string
              exchangeLinkName:
                type: boolean
              excludeNodes:
                items:
                  type: string
                type: array
              nodeSelector:
                properties:
                  matchExpressions:
                    items:
                      properties:
                        key:
                          type: string
                        operator:
                          type: string
                        values:
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              preserveVlanInterfaces:
                type: boolean
              vlanInterfaces:
                items:
                  type: string
                type: array
            required:
            - defaultInterface
            type: object
          status:
            properties:
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    lastUpdateTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    node:
                      type: string
                    observedGeneration:
                      format: int64
                      type: integer
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  type: object
                type: array
              notReadyNodes:
                items:
                  type: string
                type: array
              ready:
                type: boolean
              readyNodes:
                items:
                  type: string
                type: array
              vlans:
                items:
                  type: string
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
