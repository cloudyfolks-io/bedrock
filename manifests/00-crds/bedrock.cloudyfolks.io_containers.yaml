                    <= 0) && (!has(self.requests.memory) || !has(self.limits.memory)
                    || quantity(string(self.requests.memory)).compareTo(quantity(string(self.limits.memory)))
                    <= 0))'
                - message: limits.cpu must be at most 32
                  rule: '!has(self.limits) || !has(self.limits.cpu) || quantity(string(self.limits.cpu)).compareTo(quantity(''32''))
                    <= 0'
                - message: limits.memory must be at most 256Gi
                  rule: '!has(self.limits) || !has(self.limits.memory) || quantity(string(self.limits.memory)).compareTo(quantity(''256Gi''))
                    <= 0'
              strategy:
                enum:
                - Recreate
                - RollingUpdate
                type: string
              volumes:
