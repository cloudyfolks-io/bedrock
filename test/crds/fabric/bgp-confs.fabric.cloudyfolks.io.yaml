apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
    helm.sh/resource-policy: keep
  name: bgp-confs.fabric.cloudyfolks.io
spec:
  group: fabric.cloudyfolks.io
  names:
    kind: BgpConf
    listKind: BgpConfList
    plural: bgp-confs
    singular: bgp-conf
  scope: Cluster
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              advertiseFilter:
                items:
                  type: string
                type: array
              connectTime:
                type: string
              ebgpMultiHop:
                type: boolean
              gracefulRestart:
                type: boolean
              holdTime:
                type: string
              keepaliveTime:
                type: string
              localASN:
                format: int64
                maximum: 4294967295
                minimum: 0
                type: integer
              neighbours:
                items:
                  type: string
                type: array
              nodeSelector:
                additionalProperties:
                  type: string
                type: object
              password:
                type: string
              peerASN:
                format: int64
                maximum: 4294967295
                minimum: 0
                type: integer
              peers:
                items:
                  properties:
                    address:
                      minLength: 1
                      type: string
                    asn:
                      format: int64
                      maximum: 4294967295
                      minimum: 0
                      type: integer
                    bfd:
                      type: boolean
                  required:
                  - address
                  type: object
                type: array
              redistributeTables:
                items:
                  format: int32
                  maximum: 65535
                  minimum: 1
                  type: integer
                type: array
              routerId:
                type: string
            type: object
          status:
            properties:
              nodes:
                items:
                  properties:
                    lastUpdateTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    node:
                      type: string
                    serial:
                      type: string
                    state:
                      enum:
                      - Applied
                      - Pending
                      - Failed
                      type: string
                  required:
                  - node
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - node
                x-kubernetes-list-type: map
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
