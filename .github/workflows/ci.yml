name: ci
on:
  pull_request:
  schedule:
    - cron: "20 1 * * *"
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          : > changed-paths
          if [ "$EVENT" = pull_request ]; then
            # --no-renames includes both sides of moves, preventing scope evasion.
            git diff --no-renames --name-only -z "$BASE...$HEAD" > changed-paths
            python3 hack/ci_plan.py --paths-file changed-paths >> "$GITHUB_OUTPUT"
          else
            python3 hack/ci_plan.py --paths-file changed-paths --full >> "$GITHUB_OUTPUT"
          fi
  fast-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - run: make generate crds
      - run: git diff --exit-code && test -z "$(git status --porcelain)"
      - run: make lint
      - run: python3 -m unittest discover -s hack -p 'test_ci_*.py'
      - run: make test-unit
      - run: make release VERSION=ci
      - run: hack/check-release.sh
      - run: make rbac UI_PREBUILT=1 && git diff --exit-code manifests/90-bedrock/operator-rbac.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: ui-${{ github.sha }}
          include-hidden-files: true
          path: |
            internal/authn/server/ui/dist
            internal/proxy/ui/dist
  envtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make test-envtest
  # Preserve the existing required "test" check's complete test semantics.
  test:
    runs-on: ubuntu-latest
    needs: [fast-checks, envtest]
    if: always()
    steps:
      - env:
          FAST: ${{ needs.fast-checks.result }}
          ENVTEST: ${{ needs.envtest.result }}
        run: test "$FAST" = success && test "$ENVTEST" = success
  e2e-kind:
    runs-on: ubuntu-latest
    needs: [fast-checks, plan]
    if: contains(fromJSON(needs.plan.outputs.jobs), 'kind')
    env:
      UI_PREBUILT: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ui-${{ github.sha }}
          path: internal
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: make e2e-kind
  e2e-init:
    runs-on: ubuntu-latest
    needs: [fast-checks, plan]
    if: contains(fromJSON(needs.plan.outputs.jobs), 'init')
    env:
      UI_PREBUILT: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ui-${{ github.sha }}
          path: internal
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - run: make build release VERSION=dev
      - run: docker build -t ghcr.io/cloudyfolks-io/bedrock:dev -f Containerfile .
      - run: sudo -E env "PATH=$PATH" KUBECONFIG=/var/lib/k0s/pki/admin.conf hack/e2e-init.sh
  e2e-bundle:
    runs-on: ubuntu-latest
    needs: [fast-checks, plan]
    if: contains(fromJSON(needs.plan.outputs.jobs), 'bundle')
    env:
      UI_PREBUILT: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ui-${{ github.sha }}
          path: internal
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - run: make build binaries VERSION=dev
      - run: docker build -t localhost:5000/bedrock:dev -f Containerfile .
      - run: docker run --rm -d -p 5000:5000 --name registry registry:3
      - run: for i in $(seq 1 30); do curl -sf http://localhost:5000/v2/ && break; sleep 1; done; curl -sf http://localhost:5000/v2/
      - run: docker push localhost:5000/bedrock:dev
      - run: make release-from-build bundle-from-release VERSION=dev IMAGE=localhost:5000/bedrock:dev PIN_DIGESTS=1
      - run: docker rm -f registry
      - run: sudo -E env "PATH=$PATH" KUBECONFIG=/var/lib/k0s/pki/admin.conf BUNDLE=dist/bedrock-dev-bundle-amd64.tar.zst IMAGE=localhost:5000/bedrock:dev hack/e2e-init.sh
  e2e-authn:
    runs-on: ubuntu-latest
    needs: [fast-checks, plan]
    if: contains(fromJSON(needs.plan.outputs.jobs), 'authn')
    env:
      UI_PREBUILT: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ui-${{ github.sha }}
          path: internal
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - run: make build binaries VERSION=dev
      - run: docker build -t localhost:5000/bedrock:dev -f Containerfile .
      - run: docker run --rm -d -p 5000:5000 --name registry registry:3
      - run: for i in $(seq 1 30); do curl -sf http://localhost:5000/v2/ && break; sleep 1; done; curl -sf http://localhost:5000/v2/
      - run: docker push localhost:5000/bedrock:dev
      - run: make release-from-build bundle-from-release VERSION=dev IMAGE=localhost:5000/bedrock:dev PIN_DIGESTS=1
      - run: docker rm -f registry
      - run: CGO_ENABLED=0 go test -c -tags e2e -o dist/e2e-authn-amd64.test ./test/e2e/authn
      - run: make crane && CRANE=$(go env GOPATH)/bin/crane hack/e2e-authn-images.sh
      - run: sudo -E env "PATH=$PATH" KUBECONFIG=/var/lib/k0s/pki/admin.conf BUNDLE=dist/bedrock-dev-bundle-amd64.tar.zst IMAGE=localhost:5000/bedrock:dev hack/e2e-init.sh
      - run: sudo -E env "PATH=$PATH" BEDROCK_BIN=dist/bedrock-dev-linux-amd64 E2E_TEST=dist/e2e-authn-amd64.test hack/e2e-authn.sh
  e2e-tenant:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [fast-checks, plan]
    if: contains(fromJSON(needs.plan.outputs.jobs), 'tenant')
    env:
      UI_PREBUILT: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ui-${{ github.sha }}
          path: internal
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /opt/hostedtoolcache/* && docker image prune -af && df -h /
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - run: hack/e2e-release-config.sh release/components.yaml dist/components-e2e.yaml
      - run: make build binaries VERSION=dev
      - run: docker build -t localhost:5000/bedrock:dev -f Containerfile .
      - run: docker run --rm -d -p 5000:5000 --name registry registry:3
      - run: for i in $(seq 1 30); do curl -sf http://localhost:5000/v2/ && break; sleep 1; done; curl -sf http://localhost:5000/v2/
      - run: docker push localhost:5000/bedrock:dev
      - run: make release-from-build bundle-from-release VERSION=dev IMAGE=localhost:5000/bedrock:dev PIN_DIGESTS=1 RELEASE_CONFIG=dist/components-e2e.yaml
      - run: docker rm -f registry && docker system prune -af && df -h /
      - run: CGO_ENABLED=0 go test -c -tags e2e -o dist/e2e-tenant-amd64.test ./test/e2e/tenant
      - run: make crane && CRANE=$(go env GOPATH)/bin/crane hack/e2e-tenant-images.sh
      - run: sudo -E env "PATH=$PATH" KUBECONFIG=/var/lib/k0s/pki/admin.conf BUNDLE=dist/bedrock-dev-bundle-amd64.tar.zst IMAGE=localhost:5000/bedrock:dev E2E_OSD_DEVICE=loop E2E_PROVIDER_NETWORK=public hack/e2e-init.sh
      - run: sudo -E env "PATH=$PATH" BEDROCK_BIN=dist/bedrock-dev-linux-amd64 E2E_TEST=dist/e2e-tenant-amd64.test hack/e2e-tenant.sh
  upgrade-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [fast-checks, plan]
    if: contains(fromJSON(needs.plan.outputs.jobs), 'upgrade')
    env: &upgrade-versions
      UI_PREBUILT: "1"
      VERSION_A: v0.0.0-e2e.1
      VERSION_B: v0.0.0-e2e.2
      K0S_A: v1.36.2+k0s.0
      K0S_B: v1.36.3+k0s.0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ui-${{ github.sha }}
          path: internal
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /opt/hostedtoolcache/* && docker image prune -af && df -h /
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - run: docker run --rm -d -p 5000:5000 --name registry registry:3
      - run: for i in $(seq 1 30); do curl -sf http://localhost:5000/v2/ && break; sleep 1; done; curl -sf http://localhost:5000/v2/
      - run: hack/e2e-upgrade-build.sh && rm -rf dist/cache
      - name: Package compatible upgrade inputs once
        run: |
          git rev-parse HEAD > dist/upgrade-source
          tar -cf "$RUNNER_TEMP/upgrade-inputs.tar" dist/upgrade-source dist/bedrock-* dist/release-v0.0.0-e2e.*
      - uses: actions/upload-artifact@v4
        with:
          name: upgrade-inputs-${{ github.sha }}
          path: ${{ runner.temp }}/upgrade-inputs.tar
          compression-level: 0
          retention-days: 3
  e2e-upgrade:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [upgrade-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: e2e-upgrade
            abort: ""
          - name: e2e-upgrade-abort
            abort: ControlPlane
    env: *upgrade-versions
    steps:
      - uses: actions/checkout@v5
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /opt/hostedtoolcache/* && docker image prune -af && df -h /
      - uses: actions/download-artifact@v4
        with:
          name: upgrade-inputs-${{ github.sha }}
          path: ${{ runner.temp }}/upgrade-inputs
      - name: Restore exact-source upgrade inputs
        run: |
          tar -xf "$RUNNER_TEMP/upgrade-inputs/upgrade-inputs.tar"
          test "$(cat dist/upgrade-source)" = "$(git rev-parse HEAD)"
          rm "$RUNNER_TEMP/upgrade-inputs/upgrade-inputs.tar"
      - run: sudo -E env "PATH=$PATH" hack/e2e-upgrade.sh
        env:
          ABORT_IN: ${{ matrix.abort }}
