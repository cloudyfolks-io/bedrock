apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bedrock-project-viewer
  labels:
    bedrock.cloudyfolks.io/kind: ClusterRole
    bedrock.cloudyfolks.io/name: bedrock-project-viewer
rules:
  - apiGroups: [bedrock.cloudyfolks.io]
    resources: [containers, dnszones, elasticips, images, internetgateways, loadbalancers, objectstoragebuckets, objectstorageusers, securitygroups, sshkeys, subnets, virtualmachinebackups, virtualmachinerestores, virtualmachines, volumes, volumesnapshots]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [configmaps, events, pods, pods/log, resourcequotas, services]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [aaq.kubevirt.io]
    resources: [applicationawareresourcequotas]
    verbs: [get, list, watch]
  - apiGroups: [bedrock.cloudyfolks.io]
    resources: [containers/logs]
    verbs: [get]
---
