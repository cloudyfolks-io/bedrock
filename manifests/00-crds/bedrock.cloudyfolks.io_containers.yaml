                  properties:
                    mountPath:
                      maxLength: 4096
                      pattern: ^/[^:]+$
                      type: string
                    volumeRef:
                      maxLength: 253
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                      type: string
                  required:
                  - mountPath
                  - volumeRef
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-type: atomic
                x-kubernetes-validations:
                - message: a volume can be listed once
                  rule: self.all(a, self.exists_one(b, b.volumeRef == a.volumeRef))
                - message: a mount path can be used once
                  rule: self.all(a, self.exists_one(b, b.mountPath == a.mountPath))
            required:
            - image
            type: object
            x-kubernetes-validations:
            - message: replicas and autoscale exclude each other
              rule: '!has(self.replicas) || !has(self.autoscale)'
            - message: address needs replicas of at most 1 and no autoscale
              rule: '!has(self.network.address) || (!has(self.autoscale) && (!has(self.replicas)
                || self.replicas <= 1))'
            - message: volumes need replicas of at most 1 and no autoscale
              rule: '!has(self.volumes) || self.volumes.size() == 0 || (!has(self.autoscale)
                && (!has(self.replicas) || self.replicas <= 1))'
            - message: address and volumes need the strategy Recreate
              rule: '!has(self.strategy) || self.strategy == ''Recreate'' || (!has(self.network.address)
                && (!has(self.volumes) || self.volumes.size() == 0))'
