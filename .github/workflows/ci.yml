name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - run: make generate crds
      - run: git diff --exit-code && test -z "$(git status --porcelain)"
      - run: make lint
      - run: make test
      - run: make release VERSION=ci
      - run: hack/check-release.sh
      - run: make rbac && git diff --exit-code manifests/90-bedrock/operator-rbac.yaml
  e2e-kind:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: make e2e-kind
  e2e-init:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - run: make build release VERSION=dev
      - run: docker build -t ghcr.io/cloudyfolks-io/bedrock:dev -f Containerfile .
      - run: sudo -E env "PATH=$PATH" KUBECONFIG=/var/lib/k0s/pki/admin.conf hack/e2e-init.sh
  e2e-bundle:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - run: make build release VERSION=dev IMAGE=localhost:5000/bedrock:dev PIN_DIGESTS=1
      - run: docker build -t localhost:5000/bedrock:dev -f Containerfile .
      - run: docker run --rm -d -p 5000:5000 --name registry registry:3
      - run: for i in $(seq 1 30); do curl -sf http://localhost:5000/v2/ && break; sleep 1; done; curl -sf http://localhost:5000/v2/
      - run: docker push localhost:5000/bedrock:dev
      - run: make bundle VERSION=dev IMAGE=localhost:5000/bedrock:dev PIN_DIGESTS=1
      - run: docker rm -f registry
      - run: sudo -E env "PATH=$PATH" KUBECONFIG=/var/lib/k0s/pki/admin.conf BUNDLE=dist/bedrock-dev-bundle-amd64.tar.zst IMAGE=localhost:5000/bedrock:dev hack/e2e-init.sh
  e2e-authn:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - run: make build release VERSION=dev IMAGE=localhost:5000/bedrock:dev PIN_DIGESTS=1
      - run: docker build -t localhost:5000/bedrock:dev -f Containerfile .
      - run: docker run --rm -d -p 5000:5000 --name registry registry:3
      - run: for i in $(seq 1 30); do curl -sf http://localhost:5000/v2/ && break; sleep 1; done; curl -sf http://localhost:5000/v2/
      - run: docker push localhost:5000/bedrock:dev
      - run: make bundle VERSION=dev IMAGE=localhost:5000/bedrock:dev PIN_DIGESTS=1
      - run: docker rm -f registry
      - run: CGO_ENABLED=0 go test -c -tags e2e -o dist/e2e-authn-amd64.test ./test/e2e/authn
      - run: hack/e2e-authn-images.sh
      - run: sudo -E env "PATH=$PATH" KUBECONFIG=/var/lib/k0s/pki/admin.conf BUNDLE=dist/bedrock-dev-bundle-amd64.tar.zst IMAGE=localhost:5000/bedrock:dev hack/e2e-init.sh
      - run: sudo -E env "PATH=$PATH" BEDROCK_BIN=dist/bedrock-dev-linux-amd64 E2E_TEST=dist/e2e-authn-amd64.test hack/e2e-authn.sh
  e2e-upgrade:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: e2e-upgrade
            abort: ""
          - name: e2e-upgrade-abort
            abort: ControlPlane
    env:
      VERSION_A: v0.0.0-e2e.1
      VERSION_B: v0.0.0-e2e.2
      K0S_A: v1.36.2+k0s.0
      K0S_B: v1.36.3+k0s.0
      ABORT_IN: ${{ matrix.abort }}
    steps:
      - uses: actions/checkout@v5
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /opt/hostedtoolcache/* && docker image prune -af && df -h /
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - run: docker run --rm -d -p 5000:5000 --name registry registry:3
      - run: for i in $(seq 1 30); do curl -sf http://localhost:5000/v2/ && break; sleep 1; done; curl -sf http://localhost:5000/v2/
      - run: hack/e2e-upgrade-build.sh && rm -rf dist/cache
      - run: docker rm -f registry && docker system prune -af && df -h /
      - run: sudo -E env "PATH=$PATH" hack/e2e-upgrade.sh
