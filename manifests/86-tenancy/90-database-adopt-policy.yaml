apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bedrock-database-adopt
  labels:
    bedrock.cloudyfolks.io/kind: ValidatingAdmissionPolicy
    bedrock.cloudyfolks.io/name: bedrock-database-adopt
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [bedrock.cloudyfolks.io]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE]
        resources: [databaseusers, databaseschemas]
  matchConditions:
    - name: bedrock-identity
      expression: "request.userInfo.username.startsWith('bedrock:')"
  variables:
    - name: adoptNew
      expression: "has(object.metadata.annotations) && 'bedrock.cloudyfolks.io/adopt' in object.metadata.annotations ? object.metadata.annotations['bedrock.cloudyfolks.io/adopt'] : ''"
    - name: adoptOld
      expression: "request.operation == 'CREATE' ? '' : (has(oldObject.metadata.annotations) && 'bedrock.cloudyfolks.io/adopt' in oldObject.metadata.annotations ? oldObject.metadata.annotations['bedrock.cloudyfolks.io/adopt'] : '')"
  validations:
    - expression: >-
        'bedrock:bedrock-admins' in request.userInfo.groups ||
        variables.adoptNew == variables.adoptOld
      message: "only an administrator may set the adopt annotation of a database user or schema"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bedrock-database-adopt
  labels:
    bedrock.cloudyfolks.io/kind: ValidatingAdmissionPolicyBinding
    bedrock.cloudyfolks.io/name: bedrock-database-adopt
spec:
  policyName: bedrock-database-adopt
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bedrock-database-security-group
  labels:
    bedrock.cloudyfolks.io/kind: ValidatingAdmissionPolicy
    bedrock.cloudyfolks.io/name: bedrock-database-security-group
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: bedrock.cloudyfolks.io/tenant
          operator: Exists
    resourceRules:
      - apiGroups: [bedrock.cloudyfolks.io]
        apiVersions: [v1alpha1]
        operations: [UPDATE, DELETE]
        resources: [securitygroups]
  matchConditions:
    - name: require-database-security-group-checks
      expression: >-
        !(request.userInfo.username in [
          'system:serviceaccount:bedrock-system:bedrock-operator',
          'system:serviceaccount:kube-system:namespace-controller',
          'system:serviceaccount:kube-system:generic-garbage-collector',
          'system:kube-controller-manager'
        ])
  validations:
    - expression: >-
        (has(request.userInfo.groups) && ('system:masters' in request.userInfo.groups || 'bedrock:bedrock-admins' in request.userInfo.groups)) ||
        !has(oldObject.metadata.ownerReferences) ||
        !oldObject.metadata.ownerReferences.exists(owner,
          owner.apiVersion == 'bedrock.cloudyfolks.io/v1alpha1' && owner.kind == 'Database' && owner.?controller.orValue(false))
      message: "only the database controller or an administrator can change the database security group"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bedrock-database-security-group
  labels:
    bedrock.cloudyfolks.io/kind: ValidatingAdmissionPolicyBinding
    bedrock.cloudyfolks.io/name: bedrock-database-security-group
spec:
  policyName: bedrock-database-security-group
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bedrock-database-proxy-identity
  labels:
    bedrock.cloudyfolks.io/kind: ValidatingAdmissionPolicy
    bedrock.cloudyfolks.io/name: bedrock-database-proxy-identity
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: bedrock.cloudyfolks.io/tenant
          operator: Exists
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [pods, configmaps, secrets]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [deployments, replicasets]
  matchConditions:
    - name: require-proxy-identity-checks
      expression: >-
        !(has(request.userInfo.groups) && ('system:masters' in request.userInfo.groups || 'bedrock:bedrock-admins' in request.userInfo.groups)) &&
        !(request.userInfo.username == 'system:serviceaccount:bedrock-system:bedrock-operator') &&
        !(request.resource.resource == 'replicasets' && request.userInfo.username == 'system:serviceaccount:kube-system:deployment-controller') &&
        !(request.resource.resource == 'pods' && request.userInfo.username == 'system:serviceaccount:kube-system:replicaset-controller') &&
        !(request.resource.resource == 'secrets' && request.userInfo.username == 'system:serviceaccount:cert-manager:cert-manager') &&
        !(request.operation == 'DELETE' && request.userInfo.username in [
          'system:serviceaccount:kube-system:namespace-controller',
          'system:serviceaccount:kube-system:generic-garbage-collector',
          'system:kube-controller-manager'
        ])
  variables:
    - name: prefix
      expression: "'bedrock-db-proxy-'"
    - name: key
      expression: "'bedrock.cloudyfolks.io/database-gate-client'"
    - name: previousLabels
      expression: "oldObject.metadata.?labels.orValue({})"
    - name: previousGateIdentity
      expression: "variables.previousLabels[?variables.key].orValue('')"
    - name: protectedPodUpdate
      expression: >-
        request.operation == 'UPDATE' && request.resource.group == '' && request.resource.resource == 'pods' &&
        variables.previousGateIdentity != '' &&
        variables.previousLabels[?'network.cloudyfolks.com/class'].orValue('') == 'managed' &&
        variables.previousLabels[?'app.kubernetes.io/managed-by'].orValue('') == 'bedrock' &&
        variables.previousLabels[?'app.kubernetes.io/component'].orValue('') == 'endpoint' &&
        variables.previousLabels[?'app.kubernetes.io/instance'].orValue('') == 'db-' + variables.previousGateIdentity &&
        request.name.startsWith(variables.prefix + variables.previousGateIdentity + '-') &&
        oldObject.metadata.?ownerReferences.orValue([]).exists(owner,
          owner.apiVersion == 'apps/v1' && owner.kind == 'ReplicaSet' && owner.uid != '' &&
          owner.name.startsWith(variables.prefix + variables.previousGateIdentity + '-') &&
          oldObject.metadata.?generateName.orValue('') == owner.name + '-' && owner.?controller.orValue(false)) &&
        object.metadata.?generateName == oldObject.metadata.?generateName &&
        object.metadata.?labels == oldObject.metadata.?labels &&
        object.metadata.?ownerReferences == oldObject.metadata.?ownerReferences &&
        object.metadata.?finalizers == oldObject.metadata.?finalizers
    - name: previousPodSpec
      expression: "dyn(oldObject).spec"
    - name: updatedPodSpec
      expression: "dyn(object).spec"
    - name: previousAnnotations
      expression: "oldObject.metadata.?annotations.orValue({})"
    - name: updatedAnnotations
      expression: "object.metadata.?annotations.orValue({})"
    - name: providerPrefixes
      expression: "['fabric.cloudyfolks.io/', 'vpc.kube-system.fabric.cloudyfolks.io/']"
    - name: aaqPodUpdate
      expression: >-
        request.userInfo.username == 'system:serviceaccount:aaq:aaq-controller' && variables.protectedPodUpdate &&
        variables.previousPodSpec.?schedulingGates.orValue([]).map(gate, gate.name) == ['ApplicationAwareQuotaGate'] &&
        variables.updatedPodSpec.?schedulingGates.orValue([]).size() == 0 &&
        variables.previousAnnotations == variables.updatedAnnotations &&
        variables.previousPodSpec.containers == variables.updatedPodSpec.containers &&
        variables.previousPodSpec.?initContainers == variables.updatedPodSpec.?initContainers &&
        variables.previousPodSpec.?activeDeadlineSeconds == variables.updatedPodSpec.?activeDeadlineSeconds &&
        variables.previousPodSpec.?terminationGracePeriodSeconds == variables.updatedPodSpec.?terminationGracePeriodSeconds &&
        variables.previousPodSpec.?tolerations == variables.updatedPodSpec.?tolerations &&
        variables.previousPodSpec.?nodeSelector == variables.updatedPodSpec.?nodeSelector &&
        variables.previousPodSpec.?affinity == variables.updatedPodSpec.?affinity
    - name: fabricPodUpdate
      expression: >-
        request.userInfo.username == 'system:serviceaccount:kube-system:ovn' && variables.protectedPodUpdate &&
        variables.previousPodSpec == variables.updatedPodSpec &&
        variables.previousAnnotations.all(key,
          key in variables.updatedAnnotations ||
          (variables.previousAnnotations[key] == 'true' && variables.providerPrefixes.exists(prefix,
            key == prefix + 'allocated' || key == prefix + 'routed'))) &&
        variables.updatedAnnotations.all(key,
          (key in variables.previousAnnotations && variables.previousAnnotations[key] == variables.updatedAnnotations[key]) ||
          key == 'fabric.cloudyfolks.io/ip_address' ||
          variables.providerPrefixes.exists(prefix,
            ((key == prefix + 'allocated' || key == prefix + 'routed') && variables.updatedAnnotations[key] == 'true') ||
            (key == prefix + 'pod_nic_type' && variables.previousAnnotations[?key].orValue('') == '') ||
            ['mac_address', 'cidr', 'gateway', 'logical_router', 'vlan_id', 'provider_network'].exists(field, key == prefix + field)))
  validations:
    - expression: >-
        (!request.name.startsWith(variables.prefix) &&
         (object == null ||
           (!object.metadata.?name.orValue('').startsWith(variables.prefix) &&
            !object.metadata.?generateName.orValue('').startsWith(variables.prefix) &&
            !(variables.key in object.metadata.?labels.orValue({})))) &&
         (oldObject == null || !(variables.key in oldObject.metadata.?labels.orValue({})))) ||
        variables.aaqPodUpdate || variables.fabricPodUpdate
      message: "only the platform can manage a database proxy resource or identity"
      reason: Forbidden
    - expression: >-
        request.resource.group != 'apps' ||
        ((object == null || !(variables.key in object.spec.template.metadata.?labels.orValue({}))) &&
         (oldObject == null || !(variables.key in oldObject.spec.template.metadata.?labels.orValue({}))))
      message: "only the platform can set the database proxy identity on a pod template"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bedrock-database-proxy-identity
  labels:
    bedrock.cloudyfolks.io/kind: ValidatingAdmissionPolicyBinding
    bedrock.cloudyfolks.io/name: bedrock-database-proxy-identity
spec:
  policyName: bedrock-database-proxy-identity
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bedrock-database-proxy-access
  labels:
    bedrock.cloudyfolks.io/kind: ValidatingAdmissionPolicy
    bedrock.cloudyfolks.io/name: bedrock-database-proxy-access
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: bedrock.cloudyfolks.io/tenant
          operator: Exists
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CONNECT]
        resources: [pods/exec, pods/attach, pods/portforward]
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [UPDATE]
        resources: [pods/ephemeralcontainers]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [UPDATE]
        resources: [deployments/scale, replicasets/scale]
  validations:
    - expression: >-
        !request.name.startsWith('bedrock-db-proxy-') ||
        (has(request.userInfo.groups) && ('system:masters' in request.userInfo.groups || 'bedrock:bedrock-admins' in request.userInfo.groups)) ||
        request.userInfo.username == 'system:serviceaccount:bedrock-system:bedrock-operator'
      message: "only the platform can access managed database proxy subresources"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bedrock-database-proxy-access
  labels:
    bedrock.cloudyfolks.io/kind: ValidatingAdmissionPolicyBinding
    bedrock.cloudyfolks.io/name: bedrock-database-proxy-access
spec:
  policyName: bedrock-database-proxy-access
  validationActions: [Deny]
