apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy
  namespace: monitoring
data:
  config.alloy: |
    discovery.kubernetes "pods" {
      role = "pod"
      selectors {
        role  = "pod"
        field = "spec.nodeName=" + coalesce(sys.env("NODE_NAME"), "")
      }
    }

    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_kubevirt_io_domain"]
        target_label  = "vm"
      }
      rule {
        target_label = "log_source"
        replacement  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        regex         = "guest-console-log"
        target_label  = "log_source"
        replacement   = "vm-serial-console"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        target_label  = "__path__"
        replacement   = "/var/log/pods/*$1/*.log"
      }
    }

    local.file_match "pods" {
      path_targets = discovery.relabel.pods.output
    }

    loki.source.file "pods" {
      targets    = local.file_match.pods.targets
      forward_to = [loki.process.pods.receiver]
    }

    loki.process "pods" {
      stage.cri {}
      forward_to = [loki.write.loki.receiver]
    }

    loki.relabel "journal" {
      forward_to = []
      rule {
        source_labels = ["__journal__systemd_unit"]
        target_label  = "unit"
      }
    }

    loki.source.journal "persistent" {
      path          = "/var/log/journal"
      forward_to    = [loki.write.loki.receiver]
      relabel_rules = loki.relabel.journal.rules
      labels        = { job = "journald", node = coalesce(sys.env("NODE_NAME"), "") }
    }

    loki.source.journal "volatile" {
      path          = "/run/log/journal"
      forward_to    = [loki.write.loki.receiver]
      relabel_rules = loki.relabel.journal.rules
      labels        = { job = "journald", node = coalesce(sys.env("NODE_NAME"), "") }
    }

    local.file_match "audit" {
      path_targets = [{ "__path__" = "/var/log/bedrock/audit/audit.log", "job" = "kube-apiserver-audit", "node" = coalesce(sys.env("NODE_NAME"), "") }]
    }

    loki.source.file "audit" {
      targets    = local.file_match.audit.targets
      forward_to = [loki.write.loki.receiver]
    }

    loki.write "loki" {
      endpoint {
        url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
      }
    }
