---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: databaseversions.bedrock.cloudyfolks.io
spec:
  group: bedrock.cloudyfolks.io
  names:
    kind: DatabaseVersion
    listKind: DatabaseVersionList
    plural: databaseversions
    singular: databaseversion
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.engine
      name: Engine
      type: string
    - jsonPath: .spec.major
      name: Major
      type: string
    - jsonPath: .spec.enabled
      name: Enabled
      type: boolean
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              companions:
                additionalProperties:
                  type: string
                maxProperties: 16
                type: object
              enabled:
                default: true
                type: boolean
              engine:
                enum:
                - postgresql
                - mysql
                - valkey
                type: string
              eolDate:
                format: date
                maxLength: 10
                type: string
              image:
                maxLength: 1024
                minLength: 1
                type: string
              major:
                maxLength: 16
                pattern: ^[0-9]+(\.[0-9]+)?$
                type: string
              port:
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              upgradeTo:
                items:
                  maxLength: 16
                  pattern: ^[0-9]+(\.[0-9]+)?$
                  type: string
                maxItems: 16
                type: array
                x-kubernetes-list-type: set
            required:
            - enabled
            - engine
            - image
            - major
            - port
            type: object
            x-kubernetes-validations:
            - message: 'image must be pinned by digest with @sha256:'
              rule: self.image.contains('@sha256:')
            - message: upgradeTo must not list the major of this version
              rule: '!has(self.upgradeTo) || self.upgradeTo.all(m, m != self.major)'
            - message: 'every companion image must be pinned by digest with @sha256:'
              rule: '!has(self.companions) || self.companions.all(k, self.companions[k].contains(''@sha256:''))'
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: the name must be <engine>-<major>
          rule: self.metadata.name == self.spec.engine + '-' + self.spec.major
    served: true
    storage: true
    subresources: {}
