apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bedrock-agent-etcd-backup
  labels:
    bedrock.cloudyfolks.io/component: bedrock
rules:
  - apiGroups: [bedrock.cloudyfolks.io]
    resources: [settings]
    resourceNames: [backup.etcd-schedule, backup.archive-recipients]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bedrock-agent-etcd-backup
  labels:
    bedrock.cloudyfolks.io/component: bedrock
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bedrock-agent-etcd-backup
subjects:
  - kind: Group
    name: system:nodes
    apiGroup: rbac.authorization.k8s.io
