              observedGeneration:
                format: int64
                type: integer
              phase:
                enum:
                - Pending
                - Running
                - Stopped
                - Failed
                type: string
              readyReplicas:
                format: int32
                type: integer
              replicas:
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: the name must have at most 52 characters
          rule: self.metadata.name.size() <= 52
        - message: the name must be a DNS label
          rule: self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
