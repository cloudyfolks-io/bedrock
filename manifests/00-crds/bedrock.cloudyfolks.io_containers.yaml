                            maxItems: 64
                            minItems: 1
                            type: array
                            x-kubernetes-list-type: atomic
                        required:
                        - command
                        type: object
                      failureThreshold:
                        format: int32
                        minimum: 1
                        type: integer
                      initialDelaySeconds:
                        format: int32
                        minimum: 0
                        type: integer
                      periodSeconds:
                        format: int32
                        minimum: 1
                        type: integer
                      successThreshold:
                        format: int32
                        minimum: 1
                        type: integer
                      timeoutSeconds:
                        format: int32
                        minimum: 1
                        type: integer
                    type: object
                    x-kubernetes-validations:
                    - message: only exec probes are supported
                      rule: has(self.exec)
                type: object
              replicas:
                format: int32
                maximum: 20
                minimum: 0
                type: integer
              resources:
                default: {}
                properties:
                  limits:
                    default: {}
                    properties:
                      cpu:
                        anyOf:
                        - type: integer
                        - type: string
                        default: 500m
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      memory:
                        anyOf:
                        - type: integer
                        - type: string
                        default: 512Mi
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                    type: object
                  requests:
                    default: {}
                    properties:
                      cpu:
                        anyOf:
                        - type: integer
                        - type: string
                        default: 100m
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      memory:
                        anyOf:
                        - type: integer
                        - type: string
                        default: 128Mi
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                    type: object
