apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bedrock-objectstorage-names
  labels:
    bedrock.cloudyfolks.io/kind: ValidatingAdmissionPolicy
    bedrock.cloudyfolks.io/name: bedrock-objectstorage-names
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: [bedrock.cloudyfolks.io]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE]
        resources: [objectstoragebuckets]
  matchConditions:
    - name: bedrock-identity
      expression: "request.userInfo.username.startsWith('bedrock:')"
    - name: name-chosen
      expression: "has(object.spec.bucketName)"
  variables:
    - name: names
      expression: "params.data.?reservedNames.orValue('').split(',')"
    - name: prefixes
      expression: "params.data.?reservedPrefixes.orValue('').split(',')"
  validations:
    - expression: >-
        'bedrock:bedrock-admins' in request.userInfo.groups ||
        (request.operation == 'UPDATE' && has(oldObject.spec.bucketName) && oldObject.spec.bucketName == object.spec.bucketName) ||
        !(variables.names.exists(n, n != '' && n == object.spec.bucketName) ||
          variables.prefixes.exists(p, p != '' && object.spec.bucketName.startsWith(p)))
      message: "only an administrator may use a reserved bucket name"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bedrock-objectstorage-names
  labels:
    bedrock.cloudyfolks.io/kind: ValidatingAdmissionPolicyBinding
    bedrock.cloudyfolks.io/name: bedrock-objectstorage-names
spec:
  policyName: bedrock-objectstorage-names
  validationActions: [Deny]
  paramRef:
    name: objectstorage-name-rules
    namespace: bedrock-system
    parameterNotFoundAction: Allow
