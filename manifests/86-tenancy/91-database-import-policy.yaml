apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bedrock-database-import
  labels:
    bedrock.cloudyfolks.io/kind: ValidatingAdmissionPolicy
    bedrock.cloudyfolks.io/name: bedrock-database-import
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [bedrock.cloudyfolks.io]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE]
        resources: [databases]
  variables:
    - name: imported
      expression: "has(object.metadata.annotations) && 'bedrock.cloudyfolks.io/import' in object.metadata.annotations ? object.metadata.annotations['bedrock.cloudyfolks.io/import'] : ''"
    - name: previous
      expression: "request.operation == 'CREATE' || !has(oldObject.metadata.annotations) || !('bedrock.cloudyfolks.io/import' in oldObject.metadata.annotations) ? '' : oldObject.metadata.annotations['bedrock.cloudyfolks.io/import']"
  validations:
    - expression: >-
        'system:masters' in request.userInfo.groups || 'bedrock:bedrock-admins' in request.userInfo.groups || variables.imported == variables.previous
      message: "only an administrator may set or remove the database import marker"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bedrock-database-import
  labels:
    bedrock.cloudyfolks.io/kind: ValidatingAdmissionPolicyBinding
    bedrock.cloudyfolks.io/name: bedrock-database-import
spec:
  policyName: bedrock-database-import
  validationActions: [Deny]
