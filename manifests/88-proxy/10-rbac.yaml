apiVersion: v1
kind: ServiceAccount
metadata:
  name: bedrock-proxy
  namespace: bedrock-system
  labels:
    bedrock.cloudyfolks.io/component: proxy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bedrock-proxy-store
  namespace: bedrock-proxy
  labels:
    bedrock.cloudyfolks.io/component: proxy
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, get, list, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bedrock-proxy-store
  namespace: bedrock-proxy
  labels:
    bedrock.cloudyfolks.io/component: proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bedrock-proxy-store
subjects:
  - kind: ServiceAccount
    name: bedrock-proxy
    namespace: bedrock-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bedrock-proxy
  namespace: bedrock-system
  labels:
    bedrock.cloudyfolks.io/component: proxy
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [bedrock-console-client]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [kube-root-ca.crt, bedrock-platform-ca]
    verbs: [get]
  - apiGroups: [bedrock.cloudyfolks.io]
    resources: [sessions, users]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bedrock-proxy
  namespace: bedrock-system
  labels:
    bedrock.cloudyfolks.io/component: proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bedrock-proxy
subjects:
  - kind: ServiceAccount
    name: bedrock-proxy
    namespace: bedrock-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bedrock-proxy-base
  labels:
    bedrock.cloudyfolks.io/component: proxy
    bedrock.cloudyfolks.io/aggregate-to-proxy: "true"
rules:
  - apiGroups: [bedrock.cloudyfolks.io]
    resources: [settings]
    resourceNames: [platform.host]
    verbs: [get]
  - apiGroups: [bedrock.cloudyfolks.io]
    resources: [projects]
    verbs: [list]
  - apiGroups: [bedrock.cloudyfolks.io]
    resources: [virtualmachines]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
  - apiGroups: [bedrock.cloudyfolks.io]
    resources: [containers]
    verbs: [get, patch]
  - apiGroups: [bedrock.cloudyfolks.io]
    resources: [databases]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [kubevirt.io]
    resources: [virtualmachineinstancemigrations]
    verbs: [create]
  - apiGroups: [snapshot.kubevirt.io]
    resources: [virtualmachinesnapshots]
    verbs: [create, list]
  - apiGroups: [subresources.kubevirt.io]
    resources: [virtualmachines/restart]
    verbs: [update]
  - apiGroups: [subresources.kubevirt.io]
    resources: [virtualmachineinstances/vnc]
    verbs: [get]
  - apiGroups: [subresources.kubevirt.io]
    resources: [virtualmachineinstances/console]
    verbs: [get]
  - apiGroups: [upload.cdi.kubevirt.io]
    resources: [uploadtokenrequests]
    verbs: [create]
  - apiGroups: [bedrock.cloudyfolks.io]
    resources: [images]
    verbs: [get]
  - apiGroups: [bedrock.cloudyfolks.io]
    resources: [settings]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bedrock-proxy
  labels:
    bedrock.cloudyfolks.io/component: proxy
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        bedrock.cloudyfolks.io/aggregate-to-proxy: "true"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bedrock-proxy
  labels:
    bedrock.cloudyfolks.io/component: proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bedrock-proxy
subjects:
  - kind: ServiceAccount
    name: bedrock-proxy
    namespace: bedrock-system
