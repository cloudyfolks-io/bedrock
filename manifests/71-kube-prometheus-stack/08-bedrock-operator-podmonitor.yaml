apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: bedrock-operator
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - bedrock-system
  selector:
    matchLabels:
      app: bedrock-operator
  podMetricsEndpoints:
    - port: metrics
      relabelings:
        - targetLabel: job
          replacement: bedrock-operator
