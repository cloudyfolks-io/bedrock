apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bedrock-network-attachments
  labels:
    bedrock.cloudyfolks.io/component: network
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: bedrock.cloudyfolks.io/tenant
          operator: Exists
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: annotations
      expression: "has(object.metadata.annotations) ? object.metadata.annotations : {}"
    - name: previous
      expression: "oldObject != null && has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}"
    - name: added
      expression: >-
        variables.annotations.filter(k,
        (k.startsWith('k8s.v1.cni.cncf.io/') || k.startsWith('v1.multus-cni.io/') || k.startsWith('ovn.kubernetes.io/') || k.contains('cloudyfolks.io/')) &&
        (!(k in variables.previous) || variables.previous[k] != variables.annotations[k]))
    - name: removed
      expression: >-
        variables.previous.filter(k,
        (k.startsWith('k8s.v1.cni.cncf.io/') || k.startsWith('v1.multus-cni.io/') || k.startsWith('ovn.kubernetes.io/') || k.contains('cloudyfolks.io/')) &&
        !(k in variables.annotations))
  validations:
    - expression: >-
        request.userInfo.username in [
        'system:serviceaccount:kubevirt:kubevirt-controller',
        'system:serviceaccount:kube-system:ovn',
        'system:serviceaccount:kube-system:fabric-cni',
        'system:serviceaccount:kube-system:multus',
        'system:serviceaccount:kube-system:replicaset-controller',
        'system:serviceaccount:kube-system:statefulset-controller',
        'system:serviceaccount:kube-system:job-controller',
        'system:serviceaccount:bedrock-system:bedrock-operator'] ||
        (size(variables.added) == 0 && size(variables.removed) == 0)
      message: "only the platform may set network selection annotations"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bedrock-network-attachments
  labels:
    bedrock.cloudyfolks.io/component: network
spec:
  policyName: bedrock-network-attachments
  validationActions: [Deny]
